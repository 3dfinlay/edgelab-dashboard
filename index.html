<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>EdgeLab</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --text: #f5f5f5;
    --text-2: #a3a3a3;
    --text-3: #6e6e6e;
    --green: #4ade80;
    --red: #f87171;
    --gold: #f0b90b;
    --purple: #a97bff;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  body::before { content: ""; position: fixed; top: 0; right: 0;
    width: min(100vw, 520px); height: 420px; pointer-events: none; z-index: 0;
    background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22500%22%20height%3D%22400%22%20viewBox%3D%220%200%20500%20400%22%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28255%2C255%2C255%2C0.055%29%22%20stroke-width%3D%221.2%22%3E%0A%3Cpath%20d%3D%22M320%2040%20L400%2085%20L400%20175%20L320%20220%20L240%20175%20L240%2085%20Z%22%2F%3E%0A%3Cpath%20d%3D%22M320%2040%20L320%20130%20L240%20175%20M320%20130%20L400%20175%20M320%20130%20L320%20220%22%2F%3E%0A%3Cpath%20d%3D%22M410%20120%20L470%20155%20L470%20235%20L410%20270%20L350%20235%20L350%20155%20Z%22%2F%3E%0A%3Cpath%20d%3D%22M410%20120%20L410%20195%20L350%20230%20M410%20195%20L470%20230%22%2F%3E%0A%3Cpath%20d%3D%22M250%20180%20L310%20215%20L310%20295%20L250%20330%20L190%20295%20L190%20215%20Z%22%2F%3E%0A%3Cpath%20d%3D%22M250%20180%20L250%20255%20L190%20290%20M250%20255%20L310%20290%22%2F%3E%0A%3Cpath%20d%3D%22M380%20230%20L430%20260%20L430%20320%20L380%20350%20L330%20320%20L330%20260%20Z%22%2F%3E%0A%3Cpath%20d%3D%22M180%2060%20L230%2090%20L230%20150%20L180%20180%20L130%20150%20L130%2090%20Z%22%2F%3E%0A%3Cpath%20d%3D%22M440%2020%20L480%2043%20L480%2093%20L440%20116%20L400%2093%20L400%2043%20Z%22%2F%3E%0A%3C%2Fg%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28240%2C185%2C11%2C0.05%29%22%20stroke-width%3D%221%22%3E%0A%3Cpath%20d%3D%22M320%2040%20L400%2085%20L400%20175%20L320%20220%20L240%20175%20L240%2085%20Z%22%2F%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E") top right / contain no-repeat;
    opacity: 0.9; }
  #dash { position: relative; z-index: 1; }
  /* ---------- lock ---------- */
  #lock { min-height: 100dvh; display: flex; align-items: center; justify-content: center;
          padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  #lock .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 28px; width: min(92vw, 340px); text-align: center; }
  #lock .mark { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #f0b90b, #b8860b); }
  #lock h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  #lock p { color: var(--text-2); font-size: 14px; margin: 0 0 20px; line-height: 1.45; }
  #lock input[type=password] { width: 100%; padding: 13px 14px; font-size: 16px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    color: #fff; outline: none; margin-bottom: 12px; font-family: var(--font); }
  #lock input[type=password]:focus { border-color: #4a4a4a; }
  #lock button { width: 100%; padding: 13px; font-size: 16px; font-weight: 600;
    background: var(--text); color: var(--bg); border: none; border-radius: 12px;
    cursor: pointer; font-family: var(--font); }
  #lock button:active { transform: scale(0.98); }
  #lock button:disabled { opacity: .5; }
  #lock .err { color: var(--red); font-size: 13px; min-height: 20px; margin-top: 10px; }
  /* ---------- app frame ---------- */
  #dash { display: none; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: 0.12em; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    font-weight: 600; color: var(--text-2); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  main { max-width: 520px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  /* ---------- hero ---------- */
  .hero { background: transparent; border: none;
    border-radius: 0; margin-bottom: 4px; overflow: visible;
    position: relative; }
  .hero > * { position: relative; z-index: 1; }
  .chain-badge { display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 800; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .chain-badge img { width: 18px; height: 18px; object-fit: contain; }
  .hero.sol { border-left-color: var(--purple); }
  .hero-body { padding: 20px 20px 8px; }
  .kicker { font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .equity { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .pnl-line { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .pnl-val { font-size: 17px; font-weight: 700; }
  .pnl-sub { font-size: 13px; color: var(--text-3); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  #chart { display: block; width: 100vw; max-width: 100vw; height: 130px;
    margin-top: 10px; margin-left: calc(-1 * (100vw - 100%) / 2);
    position: relative; left: 50%; transform: translateX(-50%); }
  .chart-empty { display: flex; align-items: center; justify-content: center;
    height: 120px; color: var(--text-3); font-size: 13px; margin-top: 8px; }
  /* ---------- stat grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .stat { background: rgba(28,28,28,0.85); border: 1px solid #2e2e2e;
    border-radius: 18px; padding: 18px; backdrop-filter: blur(8px); }
  .stat .k { font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em; }
  .stat .v { font-size: 21px; font-weight: 700; margin-top: 5px; letter-spacing: -0.01em; }
  .stat .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  /* ---------- sections ---------- */
  .section { background: rgba(24,24,24,0.9); border: 1px solid #2a2a2a;
    border-radius: 20px; padding: 4px 18px; margin-bottom: 12px; }
  .section.sol { border-left: 3px solid var(--purple); }
  .section > h3 { display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 700; margin: 0; padding: 14px 0 6px; }
  .section > h3::before { content: ""; width: 3px; height: 16px; border-radius: 2px;
    background: var(--gold); flex: none; }
  .section.sol > h3::before { background: var(--purple); }
  .section > h3 .count { margin-left: auto; font-size: 12px; font-weight: 600;
    color: var(--text-3); background: var(--surface-2); border-radius: 20px;
    padding: 2px 10px; }
  .row { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: none; }
  .row .main { min-width: 0; }
  .row .sym { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .dex-link { display: inline-flex; align-items: center; opacity: 0.85; flex-shrink: 0; }
  .dex-link:hover { opacity: 1; }
  .dex-link img { width: 18px; height: 18px; object-fit: contain; display: block; }
  .row .addr { font-family: var(--mono); font-size: 11px; color: var(--text-3);
    margin-top: 2px; user-select: all; }
  .row .meta { font-size: 12px; color: var(--text-2); margin-top: 3px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px;
    text-transform: uppercase; white-space: nowrap; }
  .row .val { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .row .val .x { display: block; font-size: 11px; font-weight: 600;
    color: var(--text-3); text-align: right; margin-top: 2px; }
  .empty { padding: 18px 0; text-align: center; color: var(--text-3); font-size: 13px; }
  /* ---------- activity ---------- */
  .event { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border);
    font-size: 12px; }
  .event:first-of-type { border-top: none; }
  .event .t { font-family: var(--mono); color: var(--text-3); flex: none; }
  .event .m { font-family: var(--mono); color: var(--text-2); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  /* ---------- footer ---------- */
  .foot { text-align: center; color: var(--text-3); font-size: 12px; padding: 8px 0 4px;
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  /* ---------- transitions (rare events only) ---------- */
  #dash.enter { animation: enter 220ms ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
    #dash.enter { animation: none; }
  }
  @media (hover: hover) and (pointer: fine) {
    .row:hover { background: rgba(255,255,255,0.02); }
  }
</style>
</head>

  <div class="card">
    <div class="mark"></div>
    <h1>EdgeLab</h1>
    <p>Private trading dashboard.<br>Enter the password to view live data.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button id="go">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
const LS_KEY = "edgelab_pw";
let aesKey = null;
const $ = id => document.getElementById(id);

function b64ToBytes(s) {
  const bin = atob(s); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
async function deriveKey(password, salt, iter) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decryptPayload(payload, password) {
  const salt = b64ToBytes(payload.salt), iv = b64ToBytes(payload.iv), ct = b64ToBytes(payload.ct);
  if (!aesKey) aesKey = await deriveKey(password, salt, payload.iter || 260000);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD",
  minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmtSignedUSD(x) {
  const a = Math.abs(x);
  const s = a < 0.005 ? "$0.00" : usd2.format(a);
  return (x > 0.004 ? "+" : x < -0.004 ? "−" : "") + s;
}
function pnlClass(x) { return x > 0.004 ? "pos" : (x < -0.004 ? "neg" : ""); }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function ago(iso) {
  const t = new Date(iso).getTime(); if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return new Date(iso).toLocaleDateString();
}
function shortAddr(a) {
  a = (a || "").toLowerCase();
  return a.length > 12 ? a.slice(0, 6) + "…" + a.slice(-4) : a;
}
function exitChip(exit) {
  const e = (exit || "").toUpperCase().replace(/_/g, " ");
  return `<span class="chip">${esc(e)}</span>`;
}

function render(d) {
  const up = (d.pnl_usd || 0) >= 0;
  // Hero
  $("equity").textContent = usd0.format(d.equity_usd || 0);
  const pnlEl = $("pnl");
  pnlEl.textContent = `${fmtSignedUSD(d.pnl_usd || 0)} (${(d.pnl_usd >= 0 ? "+" : "−")}${Math.abs(d.pnl_pct || 0).toFixed(1)}%)`;
  pnlEl.className = "pnl-val " + pnlClass(d.pnl_usd || 0);
  drawChart(d.equity_hist || [], up);
  // Stats — use server aggregates (d.closed is truncated to 20 for display)
  const st = d.stats || {};
  const closed = d.closed || [];
  const wr = st.win_rate != null ? st.win_rate : 0;
  const nClosed = st.closed != null ? st.closed : closed.length;
  const nWins = st.wins != null ? st.wins : closed.filter(t => (t.realized_usd || 0) > 0.004).length;
  const realized = st.total_realized_usd != null ? st.total_realized_usd : 0;
  $("stats").innerHTML = [
    ["Win rate", wr.toFixed(0) + "%", `${nWins}/${nClosed}`, ""],
    ["Trades", String(nClosed), "closed", ""],
    ["Realized", fmtSignedUSD(realized), "session", pnlClass(realized)],
    ["Rugs", String(st.rugs ?? 0), "caught", (st.rugs || 0) > 0 ? "neg" : ""],
  ].map(([k, v, s, c]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${esc(v)}</div><div class="s">${esc(s)}</div></div>`
  ).join("");
  // Positions
  const pos = d.positions || [];
  $("posCount").textContent = pos.length;
  $("positions").innerHTML = pos.length ? pos.map(p => {

let lastHist = null, lastUp = false;
function drawChart(hist, up) {
  if (hist !== undefined) { lastHist = hist; lastUp = up; }
  else { hist = lastHist; up = lastUp; }
  if (!hist) return;
  const wrap = $("chartWrap"), c = $("chart");
  const vals = hist.map(p => p.e).filter(v => typeof v === "number");
  if (vals.length < 2) {
    wrap.innerHTML = `<div class="chart-empty">Not enough history yet</div>`;
    return;
  }
  if (!c.isConnected) { wrap.innerHTML = `<canvas id="chart"></canvas>`; }
  const cv = $("chart"), ctx = cv.getContext("2d");
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const W = cv.clientWidth * dpr, H = 130 * dpr;
  cv.width = W; cv.height = H;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const X = i => (i / (vals.length - 1)) * W;
  const Y = v => H * 0.88 - ((v - mn) / rg) * H * 0.7;
  const col = up ? "#4ade80" : "#f87171";
  ctx.clearRect(0, 0, W, H);
  // area fill
  const grad = ctx.createLinearGradient(0, 0, 0, H * 1.6);
  grad.addColorStop(0, up ? "rgba(74,222,128,0.42)" : "rgba(248,113,113,0.42)");
  grad.addColorStop(0.45, up ? "rgba(74,222,128,0.18)" : "rgba(248,113,113,0.18)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath();
  ctx.moveTo(X(0), Y(vals[0]));
  for (let i = 1; i < vals.length - 1; i++) {
    const xc = (X(i) + X(i + 1)) / 2, yc = (Y(vals[i]) + Y(vals[i + 1])) / 2;
    ctx.quadraticCurveTo(X(i), Y(vals[i]), xc, yc);
  }
  ctx.lineTo(X(vals.length - 1), Y(vals[vals.length - 1]));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // line: tight smooth curve (quadratic through midpoints --
  // like linear with rounded corners)
  const smoothPath = () => {
    ctx.beginPath();
    ctx.moveTo(X(0), Y(vals[0]));
    for (let i = 1; i < vals.length - 1; i++) {
      const xc = (X(i) + X(i + 1)) / 2, yc = (Y(vals[i]) + Y(vals[i + 1])) / 2;
      ctx.quadraticCurveTo(X(i), Y(vals[i]), xc, yc);
    }
    ctx.lineTo(X(vals.length - 1), Y(vals[vals.length - 1]));
  };
  // Red->green flip detection: confetti explosion + glow
  const isUp = up;
  if (chartWasUp === false && isUp === true) {
    const lx = X(vals.length - 1), ly = Y(vals[vals.length - 1]);
    spawnConfetti(lx, ly, W, H);
  }
  chartWasUp = isUp;
  // Draw-in animation on first load: reveal line left-to-right
  const prog = chartFirstDraw ? chartDrawProgress : 1;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W * prog, H);
  ctx.clip();
  smoothPath();
  // Neon glow when green
  if (isUp) {
    ctx.shadowColor = "#4ade80"; ctx.shadowBlur = 12 * dpr;
  }
  ctx.strokeStyle = col; ctx.lineWidth = 2 * dpr;
  ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 0;
  // session-start baseline
  const y0 = Y(vals[0]);
  ctx.setLineDash([4 * dpr, 4 * dpr]);
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
  ctx.setLineDash([]);
  // last point (with glow when green)
  ctx.beginPath();
  ctx.arc(X(vals.length - 1), Y(vals[vals.length - 1]), 3 * dpr, 0, 7);
  if (isUp) { ctx.shadowColor = "#4ade80"; ctx.shadowBlur = 16 * dpr; }
  ctx.fillStyle = col; ctx.fill();
  ctx.shadowBlur = 0;
  // confetti overlay
  drawConfetti(ctx, dpr);
  // kick the animation loop for draw-in + confetti
  if ((chartFirstDraw && chartDrawProgress < 1) || confetti.length > 0) {
    if (chartAnimFrame) cancelAnimationFrame(chartAnimFrame);
    chartAnimFrame = requestAnimationFrame(() => {
      if (chartFirstDraw) {
        chartDrawProgress = Math.min(1, chartDrawProgress + 0.03);
        if (chartDrawProgress >= 1) chartFirstDraw = false;
      }
      drawChart();
    });
  }
}

let password = null, timer = null;
// Chart animation state
let chartFirstDraw = true, chartDrawProgress = 0, chartWasUp = null;
let confetti = [], chartAnimFrame = null;

function spawnConfetti(x, y, W, H) {
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
    confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      life: 1, decay: 0.008 + Math.random() * 0.012,
      size: 2 + Math.random() * 3.5,
      color: ["#4ade80","#a7f3d0","#22ff88","#d1fae5"][i % 4],
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3 });
  }
}
function drawConfetti(ctx, dpr) {
  confetti = confetti.filter(p => p.life > 0);
  for (const p of confetti) {
    p.x += p.vx * dpr; p.y += p.vy * dpr; p.vy += 0.12 * dpr;
    p.vx *= 0.99; p.life -= p.decay; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size * dpr / 2, -p.size * dpr / 4, p.size * dpr, p.size * dpr / 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
async function fetchAndRender() {
  if (!password) return;
  try {
    const r = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("fetch " + r.status);
    render(await decryptPayload(await r.json(), password));
  } catch (e) { console.warn("refresh failed:", e); }
}
async function unlock(pw) {
  const err = $("err"), go = $("go");
  err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
  try {
    const r = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("no data");
    aesKey = null;
    await decryptPayload(await r.json(), pw);
    password = pw;
    try { localStorage.setItem(LS_KEY, pw); } catch (e) {}
    $("lock").style.display = "none";
    const dash = $("dash");
    dash.style.display = "block";
    dash.classList.add("enter");
    await fetchAndRender();
    if (!timer) timer = setInterval(fetchAndRender, 60000);
  } catch (e) {
    go.disabled = false; go.textContent = "Unlock";
    err.textContent = "Wrong password or no data. Try again.";
    aesKey = null;
  }
}
$("go").addEventListener("click", () => unlock($("pw").value));
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
(function () {
  let saved = null;
  try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
  if (saved) unlock(saved);
})();
</script>
