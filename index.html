<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeLab — Live</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #141414; color: #e8e8e8;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* lock screen */
  #lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #lock .card { background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 14px;
          padding: 32px 28px; width: min(92vw, 360px); text-align: center; }
  #lock h1 { margin: 0 0 6px; font-size: 22px; }
  #lock p { color: #9a9a9a; font-size: 14px; margin: 0 0 18px; }
  #lock input[type=password] { width: 100%; padding: 12px 14px; font-size: 16px;
      background: #141414; border: 1px solid #3a3a3a; border-radius: 8px;
      color: #fff; outline: none; margin-bottom: 12px; }
  #lock button { width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
      background: #e8e8e8; color: #141414; border: none; border-radius: 8px; cursor: pointer; }
  #lock button:disabled { opacity: .55; cursor: wait; }
  #lock .err { color: #ff6b6b; font-size: 13px; min-height: 20px; margin-top: 10px; }
  /* dashboard */
  #dash { display: none; max-width: 900px; margin: 0 auto; padding: 16px; }
  .hero { background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 14px;
          padding: 24px; margin-bottom: 16px; border-left: 4px solid #f0b90b; }
  .hero h2 { margin: 0 0 4px; font-size: 13px; color: #9a9a9a; text-transform: uppercase; letter-spacing: 1px; }
  .hero .eq { font-size: 38px; font-weight: 700; margin: 4px 0; }
  .hero .pnl { font-size: 20px; font-weight: 600; }
  .pos { color: #4ade80; } .neg { color: #f87171; } .zero { color: #9a9a9a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 10px; padding: 14px; }
  .stat .k { font-size: 12px; color: #9a9a9a; text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .section { background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 10px;
             padding: 16px; margin-bottom: 16px; }
  .section h3 { margin: 0 0 12px; font-size: 15px; border-left: 3px solid #f0b90b; padding-left: 10px; }
  .trade { display: flex; justify-content: space-between; align-items: center;
           padding: 10px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
  .trade:last-child { border-bottom: none; }
  .trade .sym { font-weight: 600; }
  .trade .meta { color: #9a9a9a; font-size: 12px; }
  #chart { width: 100%; height: 180px; background: #1a1a1a; border-radius: 8px; }
  .updated { text-align: center; color: #9a9a9a; font-size: 12px; padding: 12px; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
              background: #4ade80; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <h1>EdgeLab</h1>
    <p>This dashboard is private. Enter the password to view live data.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button id="go">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>
<div id="dash">
  <div class="hero" id="hero">
    <h2><span class="live-dot"></span>Live Equity</h2>
    <div class="eq" id="equity">—</div>
    <div class="pnl" id="pnl">—</div>
  </div>
  <div class="grid" id="stats"></div>
  <div class="section">
    <h3>Equity Curve</h3>
    <canvas id="chart"></canvas>
  </div>
  <div class="section">
    <h3>Open Positions</h3>
    <div id="positions"><p style="color:#9a9a9a">No open positions</p></div>
  </div>
  <div class="section">
    <h3>Recent Closed Trades</h3>
    <div id="closed"></div>
  </div>
  <div class="updated" id="updated">—</div>
</div>
<script>
const LS_KEY = "edgelab_pw";
let aesKey = null;

function b64ToBytes(s) {
  const bin = atob(s); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
async function deriveKey(password, salt, iter) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decryptPayload(payload, password) {
  const salt = b64ToBytes(payload.salt), iv = b64ToBytes(payload.iv), ct = b64ToBytes(payload.ct);
  if (!aesKey) aesKey = await deriveKey(password, salt, payload.iter || 260000);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function fmtUSD(x) {
  const s = x < 0 ? "-" : (x > 0 ? "+" : "");
  return s + "$" + Math.abs(x).toFixed(2);
}
function pnlClass(x) { return x > 0 ? "pos" : (x < 0 ? "neg" : "zero"); }

function render(d) {
  // Hero
  document.getElementById("equity").textContent = "$" + (d.equity_usd || 0).toFixed(2);
  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = fmtUSD(d.pnl_usd || 0) + " (" + (d.pnl_pct || 0).toFixed(1) + "%)";
  pnlEl.className = "pnl " + pnlClass(d.pnl_usd || 0);
  // Stats
  const closed = d.closed || [];
  const wins = closed.filter(t => (t.realized_usd || 0) > 0).length;
  const wr = closed.length ? Math.round(wins / closed.length * 100) : 0;
  document.getElementById("stats").innerHTML = [
    ["Balance", "$" + (d.balance_usd || 0).toFixed(2), ""],
    ["Trades", closed.length, ""],
    ["Win Rate", wr + "%", wr >= 50 ? "pos" : (wr > 0 ? "neg" : "zero")],
    ["BNB", "$" + (d.bnb_usd || 0).toFixed(0), ""],
  ].map(([k, v, c]) => `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("");
  // Positions
  const pos = d.positions || [];
  document.getElementById("positions").innerHTML = pos.length ? pos.map(p =>
    `<div class="trade"><div><div class="sym">${esc(p.symbol || "?")}</div>
     <div class="meta">${esc(p.token || "").slice(0, 10)}…</div></div>
     <div class="${pnlClass(p.unrealized_usd || 0)}">${fmtUSD(p.unrealized_usd || 0)}</div></div>`
  ).join("") : '<p style="color:#9a9a9a">No open positions</p>';
  // Closed
  document.getElementById("closed").innerHTML = closed.slice(0, 20).map(t => {
    const usd = t.realized_usd || 0;
    return `<div class="trade"><div><div class="sym">${esc(t.symbol || "?")}</div>
      <div class="meta">${esc(t.exit || "")} · ${esc((t.last_at || "").slice(5, 16))}</div></div>
      <div class="${pnlClass(usd)}">${fmtUSD(usd)}</div></div>`;
  }).join("") || '<p style="color:#9a9a9a">No trades yet</p>';
  // Chart
  drawChart(d.equity_hist || []);
  // Updated
  const now = new Date();
  document.getElementById("updated").innerHTML =
    `<span class="live-dot"></span>Live · updated ${now.toLocaleTimeString()} · auto-refresh 60s`;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function drawChart(hist) {
  const c = document.getElementById("chart"), ctx = c.getContext("2d");
  const W = c.width = c.offsetWidth * 2, H = c.height = 360;
  ctx.clearRect(0, 0, W, H);
  const vals = hist.map(p => p.e).filter(v => typeof v === "number");
  if (vals.length < 2) { ctx.fillStyle = "#9a9a9a"; ctx.font = "28px sans-serif";
    ctx.fillText("No history yet", 30, H / 2); return; }
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const col = vals[vals.length - 1] >= vals[0] ? "#4ade80" : "#f87171";
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
  vals.forEach((v, i) => {
    const x = 20 + i / (vals.length - 1) * (W - 40);
    const y = H - 30 - (v - mn) / rg * (H - 60);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

let password = null;
async function fetchAndRender() {
  if (!password) return;
  try {
    const r = await fetch("data.json?_=" + Date.now());
    if (!r.ok) throw new Error("fetch " + r.status);
    const payload = await r.json();
    const data = await decryptPayload(payload, password);
    render(data);
  } catch (e) { console.warn("refresh failed:", e); }
}
async function unlock(pw) {
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
  try {
    // Test decrypt with data.json
    const r = await fetch("data.json?_=" + Date.now());
    if (!r.ok) throw new Error("no data");
    const payload = await r.json();
    aesKey = null;
    await decryptPayload(payload, pw); // throws on wrong password
    password = pw;
    try { localStorage.setItem(LS_KEY, pw); } catch (e) {}
    document.getElementById("lock").style.display = "none";
    document.getElementById("dash").style.display = "block";
    await fetchAndRender();
    setInterval(fetchAndRender, 60000);
  } catch (e) {
    go.disabled = false; go.textContent = "Unlock";
    err.textContent = "Wrong password or no data. Try again.";
    aesKey = null;
  }
}
document.getElementById("go").addEventListener("click",
  () => unlock(document.getElementById("pw").value));
document.getElementById("pw").addEventListener("keydown",
  e => { if (e.key === "Enter") document.getElementById("go").click(); });
(function () {
  let saved = null;
  try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
  if (saved) unlock(saved);
})();
</script>
</body>
</html>
