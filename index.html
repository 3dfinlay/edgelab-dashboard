<title>EdgeLab &mdash; Locked</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #141414; color: #e8e8e8;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 14px;
          padding: 32px 28px; width: min(92vw, 360px); text-align: center; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  p { margin: 0 0 18px; color: #9a9a9a; font-size: 14px; }
  input[type=password] { width: 100%; padding: 12px 14px; font-size: 16px;
      background: #141414; border: 1px solid #3a3a3a; border-radius: 8px;
      color: #fff; outline: none; margin-bottom: 12px; }
  input[type=password]:focus { border-color: #6a6a6a; }
  button { width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
      background: #e8e8e8; color: #141414; border: none; border-radius: 8px;
      cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  .err { color: #ff6b6b; font-size: 13px; min-height: 20px; margin: 10px 0 0; }
  .remember { display: flex; align-items: center; gap: 8px; justify-content: center;
      margin-top: 12px; color: #9a9a9a; font-size: 13px; cursor: pointer; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>

const ITER = 260000;
const LS_KEY = "edgelab_pw";

function b64ToBytes(s) {
  const bin = atob(s); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
async function unlock(password) {
  const salt = b64ToBytes(PAYLOAD.salt), iv = b64ToBytes(PAYLOAD.iv),
        ct = b64ToBytes(PAYLOAD.ct);
  const km = await crypto.subtle.importKey("raw",
      new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(pt);
}
async function tryUnlock(password, remember) {
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
  try {
    const html = await unlock(password);
    if (remember) { try { localStorage.setItem(LS_KEY, password); } catch (e) {} }
    document.open(); document.write(html); document.close();
  } catch (e) {
    go.disabled = false; go.textContent = "Unlock";
    err.textContent = "Wrong password. Try again.";
    const c = document.getElementById("card");
    c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  }
}
document.getElementById("go").addEventListener("click", () => {
  tryUnlock(document.getElementById("pw").value,
            document.getElementById("rm").checked);
});
document.getElementById("pw").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("go").click();
});
(function () {
  let saved = null;
  try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
  if (saved) tryUnlock(saved, true);
})();
